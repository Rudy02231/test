  var cn=r['国内域链接']?'<a href="'+esc(r['国内域链接'])+'" target="_blank">国内</a>':'';
  var intl=r['国外域链接']?'<a href="'+esc(r['国外域链接'])+'" target="_blank">国外</a>':'';
  return '<tr><td>'+esc(r['活动ID'])+'</td><td class="title-cell">'+esc(r['活动标题'])+'</td><td>'+esc(r['活动管理主体'])+'</td><td class="cat-cell">'+esc(r['供应商一级分类'])+'</td><td>'+esc(r['商管团队'])+'</td><td>'+esc(r['一级类目'])+'</td><td class="cat-cell">'+esc(r['类目'])+'</td><td class="img-cell">'+(pic?'<img loading="lazy" src="'+esc(pic)+'" alt="">':'')+'</td><td>'+badge+'</td><td style="white-space:nowrap;font-size:12px">'+esc(r['创建时间'])+'</td><td class="link-cell">'+cn+'</td><td class="link-cell">'+intl+'</td></tr>';
}
function renderPage(){
  var start=(state.curPage-1)*state.PAGE,end=Math.min(start+state.PAGE,state.filtered.length);
  var tb=document.getElementById('tbody');tb.innerHTML='';
  if(!state.filtered.length){tb.innerHTML='<tr><td colspan="12" class="no-data">无匹配数据</td></tr>';}
  else{state.filtered.slice(start,end).forEach(function(r){tb.innerHTML+=buildRow(r);});}
  document.getElementById('countLabel').textContent='共 '+state.filtered.length+' 条，第 '+Math.min(start+1,Math.max(1,state.filtered.length))+'-'+end+' 条';
  var total=Math.ceil(state.filtered.length/state.PAGE),bar=document.getElementById('pagebar');
  bar.innerHTML='';if(total<=1)return;
  function btn(label,page,active){var b=document.createElement('button');b.textContent=label;if(active)b.className='active';b.onclick=function(){state.curPage=page;renderPage();window.scrollTo(0,0);};bar.appendChild(b);}
  btn('«',1,false);btn('‹',Math.max(1,state.curPage-1),false);
  var s=Math.max(1,state.curPage-2),e=Math.min(total,state.curPage+2);
  for(var i=s;i<=e;i++)btn(i,i,i===state.curPage);
  btn('›',Math.min(total,state.curPage+1),false);btn('»',total,false);
  var sp=document.createElement('span');sp.textContent='第 '+state.curPage+' / '+total+' 页';bar.appendChild(sp);
}
function getSelected(id){return Array.from(document.querySelectorAll('#'+id+'-list .cs-item-cb:checked')).map(function(cb){return cb.value;});}
function applyFilters(){
  var q=document.getElementById('search').value.toLowerCase();
  var owners=getSelected('ownerFilter');
  var teams=getSelected('teamFilter');
  var cats=getSelected('cat1Filter');
  state.filtered=RAW.filter(function(r){
    if(owners.length&&!owners.includes(r['活动管理主体']))return false;
    if(teams.length&&!teams.includes(r['商管团队']))return false;
    if(cats.length&&!cats.includes(r['一级类目']))return false;
    if(q&&!((r['活动标题']||'').toLowerCase().includes(q)||(r['活动管理主体']||'').toLowerCase().includes(q)||(r['类目']||'').toLowerCase().includes(q)||(r['活动ID']||'').includes(q)))return false;
    return true;
  });
  if(state.sortCol){state.filtered.sort(function(a,b){var av=a[state.sortCol]||'',bv=b[state.sortCol]||'';return av<bv?-state.sortDir:av>bv?state.sortDir:0;});}
  state.curPage=1;renderPage();
}
function clearFilter(id){document.querySelectorAll('#'+id+'-list .cs-item-cb').forEach(function(cb){cb.checked=false;});var a=document.getElementById(id+'-all');if(a)a.checked=false;updateLabel(id);applyFilters();updateUrl();}
function filterOptions(id,q){
  var ql=q.toLowerCase();
  document.querySelectorAll('#'+id+'-list .cs-item').forEach(function(item){
    var text=item.querySelector('span')?item.querySelector('span').textContent.toLowerCase():'';
    item.style.display=(!q||text.includes(ql))?'':'none';
  });
}
function initFilters(){
  [['活动管理主体','ownerFilter'],['商管团队','teamFilter'],['一级类目','cat1Filter']].forEach(function(p){
    var list=document.getElementById(p[1]+'-list');
    var vals=[...new Set(RAW.map(function(r){return r[p[0]]||''}).filter(Boolean))].sort();
    vals.forEach(function(v){
      var lbl=document.createElement('label');lbl.className='cs-item';
      var cb=document.createElement('input');cb.type='checkbox';cb.value=v;cb.className='cs-item-cb';
      cb.addEventListener('change',function(){updateLabel(p[1]);applyFilters();updateUrl();});
      lbl.appendChild(cb);var sp=document.createElement('span');sp.textContent=v;lbl.appendChild(sp);
      list.appendChild(lbl);
    });
  });
}
function updateLabel(id){
  var names={'ownerFilter':'管理主体','teamFilter':'商管团队','cat1Filter':'一级类目'};
  var sel=getSelected(id);
  var lbl=document.getElementById(id+'-label');
  lbl.textContent=names[id];
  var badge=document.getElementById(id+'-badge');
  if(badge)badge.textContent=sel.length||'';
  var wrap=document.getElementById(id+'-wrap');
  var trigger=wrap?wrap.querySelector('.cs-trigger'):null;
  if(trigger)trigger.classList.toggle('active',sel.length>0);
}
function toggleDropdown(id){
  var wrap=document.getElementById(id+'-wrap');
  var isOpen=wrap.classList.contains('open');
  document.querySelectorAll('.cs-wrap').forEach(function(w){w.classList.remove('open');});
  if(!isOpen)wrap.classList.add('open');
}
function toggleAll(id,checked){
  document.querySelectorAll('#'+id+'-list .cs-item-cb').forEach(function(cb){cb.checked=checked;});
  updateLabel(id);applyFilters();updateUrl();
}
document.addEventListener('click',function(e){if(!e.target.closest('.cs-wrap'))document.querySelectorAll('.cs-wrap').forEach(function(w){w.classList.remove('open');});});
document.getElementById('search').addEventListener('input',function(){applyFilters();updateUrl();});
// filter change events are now attached per-checkbox inside initFilters()
document.querySelectorAll('th[data-col]').forEach(function(th){
  th.addEventListener('click',function(){
    var col=this.getAttribute('data-col');
    if(state.sortCol===col){state.sortDir*=-1;}else{state.sortCol=col;state.sortDir=1;}
    document.querySelectorAll('th').forEach(function(t){t.className='';});
    this.className=state.sortDir===1?'sort-asc':'sort-desc';
    applyFilters();
  });
});
function updateUrl(){
  var p=new URLSearchParams();
  var q=document.getElementById('search').value.trim();
  if(q)p.set('q',q);
  getSelected('ownerFilter').forEach(function(v){p.append('owner',v);});
  getSelected('teamFilter').forEach(function(v){p.append('team',v);});
  getSelected('cat1Filter').forEach(function(v){p.append('cat',v);});

  var newUrl=location.pathname+(p.toString()?'?'+p.toString():'');
  history.replaceState(null,'',newUrl);
}
function openTranslate(engine){
  var u=encodeURIComponent(location.href);
  if(engine==='baidu'){window.open("https://fanyi.baidu.com/transpage?url="+u+"&type=1&query=url&from=zh&to=en&source=url","_blank");}
  document.getElementById("translateWrap").classList.remove("open");
}
function copyFilteredLink(){
  var url=location.href;
  var btn=document.getElementById('copyLinkBtn');
  navigator.clipboard.writeText(url).then(function(){
    btn.textContent='已复制!';btn.style.background='#1a7a3f';
    setTimeout(function(){btn.textContent='复制筛选链接';btn.style.background='#2a6049';},2000);
  }).catch(function(){prompt('复制此链接：',url);});
}
function downloadHTML(){
  var data=state.filtered;
  var filterDesc=[];
  var o=getSelected('ownerFilter');
  var t=getSelected('teamFilter');
  var c=getSelected('cat1Filter');
  var q=document.getElementById('search').value;
  if(o.length)filterDesc.push('管理主体:'+o.join('/'));
  if(t.length)filterDesc.push('商管团队:'+t.join('/'));
  if(c.length)filterDesc.push('一级类目:'+c.join('/'));
  if(q)filterDesc.push('关键词:'+q);
  var desc=filterDesc.length?filterDesc.join(' / '):'全部';
  var now=new Date();
  var ts=now.getFullYear()+('0'+(now.getMonth()+1)).slice(-2)+('0'+now.getDate()).slice(-2);
  var rows=data.map(buildRow).join('');
  var subStyle='*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;background:#f5f6fa;color:#333}.header{background:#1a2b4a;color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}.header h1{font-size:16px;font-weight:600}.header .meta{font-size:12px;opacity:.7}.toolbar{padding:12px 24px;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1;min-width:200px;padding:7px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none}.toolbar input:focus{border-color:#366092}.toolbar select{padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;background:#fff;outline:none;cursor:pointer}.count{font-size:12px;color:#888;white-space:nowrap}.btn-dl{padding:7px 16px;background:#366092;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:500}.btn-dl:hover{background:#2a4f7a}.wrap{padding:16px 24px;overflow-x:auto}table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}thead tr{background:#366092;color:#fff}th{padding:10px 12px;text-align:left;font-weight:600;font-size:12px;white-space:nowrap;cursor:pointer;user-select:none}th:hover{background:#2a4f7a}th.sort-asc::after{content:" ↑"}th.sort-desc::after{content:" ↓"}tbody tr{border-bottom:1px solid #f0f0f0;transition:background .15s}tbody tr:hover{background:#f0f5ff}td{padding:8px 12px;vertical-align:middle}td.img-cell{width:72px;min-width:72px;padding:4px 8px;text-align:center}td.img-cell img{width:64px;height:64px;object-fit:cover;border-radius:4px;display:block;background:#f5f5f5}td.link-cell{max-width:60px;text-align:center}td.link-cell a{color:#366092;text-decoration:none;font-size:12px}td.link-cell a:hover{text-decoration:underline}td.title-cell{max-width:260px;word-break:break-all;line-height:1.4}td.cat-cell{max-width:220px;word-break:break-all;font-size:12px;color:#555}.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}.badge-green{background:#e6f7ee;color:#1a7a3f}.badge-blue{background:#e6f0ff;color:#1a4a9a}.badge-gray{background:#f0f0f0;color:#666}.badge-red{background:#fff0f0;color:#c0392b}.no-data{text-align:center;padding:40px;color:#aaa;font-size:14px}.page-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;background:#fff;margin:0 24px 16px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}.page-bar button{padding:5px 12px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:12px}.page-bar button:hover{background:#f0f5ff;border-color:#366092;color:#366092}.page-bar button.active{background:#366092;color:#fff;border-color:#366092}.page-bar span{font-size:12px;color:#888}';
  var subHtml='<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>SPMB 筛选结果 '+desc+'<\/title><style>'+subStyle+'<\/style><\/head><body>'
    +'<div class="header"><h1>SPMB 筛选结果<\/h1><span class="meta">'+esc(desc)+' &nbsp;|&nbsp; 共 '+data.length+' 条<\/span><\/div>'
    +'<div class="wrap"><table><thead><tr><th>活动ID</th><th>活动标题</th><th>管理主体</th><th>供应商一级分类</th><th>商管团队</th><th>一级类目</th><th>类目</th><th>图片</th><th>提报状态</th><th>创建时间</th><th>国内链接</th><th>国外链接</th></tr></thead><tbody>'+rows+'<\/tbody><\/table><\/div><\/body><\/html>';
  var blob=new Blob([subHtml],{type:'text\/html;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='SPMB_filtered_'+ts+'.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
initFilters();

(function(){
  var dates=RAW.map(function(r){return r['创建时间']?r['创建时间'].slice(0,10):'';}).filter(Boolean).sort();
  var dr=dates[0]+' ~ '+dates[dates.length-1];
  document.title='SPMB 活动列表 '+dr;
  var hm=document.getElementById('header-meta');
  if(hm) hm.textContent=dr+' | 共 '+RAW.length+' 条';
})();

(function(){
  var p=new URLSearchParams(location.search);
  var q=p.get('q');if(q)document.getElementById('search').value=q;
  ['owner','team','cat'].forEach(function(key,i){
    var id=['ownerFilter','teamFilter','cat1Filter'][i];
    var vals=p.getAll(key);
    if(vals.length){document.querySelectorAll('#'+id+'-list .cs-item-cb').forEach(function(cb){if(vals.includes(cb.value))cb.checked=true;});updateLabel(id);}
  });

})();
applyFilters();

</script>
</body></html>
